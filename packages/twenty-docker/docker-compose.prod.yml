name: twenty

# Production override for the Hostinger VPS deploy. Layers on top of
# docker-compose.yml — run both files together, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Unlike the base file (which pulls the upstream twentycrm/twenty image),
# this builds the image from this repo's own source, since LeapCRM carries
# fork-specific code (subscription billing, platform admin backoffice) that
# the upstream image does not contain.

services:
  server:
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
    image: leapcrm:${TAG:-latest}
    # The base file publishes 3000 directly to the host; Caddy is the only
    # public entrypoint here, so nothing else should reach the app port.
    ports: !reset []
    environment:
      FRONTEND_URL: ${FRONTEND_URL}

      EMAIL_DRIVER: ${EMAIL_DRIVER}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}

      IS_SUBSCRIPTION_BILLING_ENABLED: ${IS_SUBSCRIPTION_BILLING_ENABLED}
      SUBSCRIPTION_STRIPE_API_KEY: ${SUBSCRIPTION_STRIPE_API_KEY}
      SUBSCRIPTION_STRIPE_PUBLISHABLE_KEY: ${SUBSCRIPTION_STRIPE_PUBLISHABLE_KEY}
      SUBSCRIPTION_STRIPE_WEBHOOK_SECRET: ${SUBSCRIPTION_STRIPE_WEBHOOK_SECRET}

  worker:
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
    image: leapcrm:${TAG:-latest}
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      IS_SUBSCRIPTION_BILLING_ENABLED: ${IS_SUBSCRIPTION_BILLING_ENABLED}
      SUBSCRIPTION_STRIPE_API_KEY: ${SUBSCRIPTION_STRIPE_API_KEY}
      SUBSCRIPTION_STRIPE_PUBLISHABLE_KEY: ${SUBSCRIPTION_STRIPE_PUBLISHABLE_KEY}

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  caddy-data:
  caddy-config:
